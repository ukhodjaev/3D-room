<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setap 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@500;600;700&family=Neonderthaw&family=Sacramento&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120d16}
a{color:#3ee0c5}a:hover{color:#8af0de}
.glass{background:rgba(16,12,20,.62);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 10px 40px rgba(20,0,30,.28)}
.seg{border:0;background:transparent;color:#d9dce6;height:36px;padding:0 14px;border-radius:999px;font:500 13px/1 'Sora',sans-serif;cursor:pointer;transition:background .2s,color .2s}
.seg:hover{background:rgba(255,255,255,.08);color:#ffffff}
.seg:focus-visible,.icon:focus-visible,.act:focus-visible,.back:focus-visible{outline:2px solid #3ee0c5;outline-offset:2px}
.icon{width:36px;height:36px;border-radius:999px;border:0;background:transparent;color:#e8ebf0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
.icon:hover{background:rgba(255,255,255,.1)}
.act{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#f1f2f6;border-radius:10px;height:36px;padding:0 12px;font:500 12.5px/1 'Sora',sans-serif;cursor:pointer;transition:background .2s,border-color .2s}
.act:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24)}
.act:active{transform:translateY(1px)}
.back{border:0;background:transparent;color:#c9cdd8;display:flex;align-items:center;gap:6px;height:32px;padding:0 6px;border-radius:8px;font:500 12.5px/1 'Sora',sans-serif;cursor:pointer}
.back:hover{color:#ffffff;background:rgba(255,255,255,.06)}
.ring{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.16);border-top-color:#3ee0c5;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spot{position:absolute;left:50%;bottom:18px;width:340px;max-width:calc(100% - 140px);transform:translateX(-50%);transition:opacity .4s ease,transform .4s cubic-bezier(.2,.7,.2,1);border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.spot.off{opacity:0;pointer-events:none;transform:translate(-50%,14px)}
.spot iframe{display:block;width:100%;height:80px;border:0}
@media (max-width:560px){.spot{left:auto;right:16px;transform:none;width:auto;max-width:none;left:120px}.spot.off{transform:translateY(14px)}}
.panel{animation:rise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.panel{animation:none}.ring{animation-duration:2.4s}}

.guide{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 20px;text-align:center;background:radial-gradient(1200px 600px at 50% -10%,rgba(255,79,216,.18),transparent 60%),radial-gradient(900px 500px at 50% 110%,rgba(122,92,255,.16),transparent 60%),#120d16}
.guide h1{margin:0;font:600 clamp(22px,4.4vw,32px)/1.25 'Sora',sans-serif;max-width:560px}
.g-badge{font:600 12px/1 'Sora',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#ff9be9;border:1px solid rgba(255,79,216,.4);background:rgba(255,79,216,.08);padding:8px 12px;border-radius:999px}
.g-lead{margin:0;max-width:520px;font:400 15px/1.6 'Sora',sans-serif;color:rgba(241,242,246,.75)}
.g-lead b{color:#fff}
.g-steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;width:min(440px,100%);text-align:left}
.g-steps li{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
.g-steps span{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 14px/1 'Sora',sans-serif;color:#120d16;background:linear-gradient(135deg,#ff6fe0,#8f7bff)}
.g-steps b{display:block;font:600 15px/1.35 'Sora',sans-serif;color:#fff}
.g-steps small{display:block;margin-top:3px;font:400 13px/1.4 'Sora',sans-serif;color:rgba(241,242,246,.65)}
.g-link{display:flex;gap:8px;align-items:center;width:min(440px,100%);padding:6px 6px 6px 14px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.g-link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font:500 13px/1 'JetBrains Mono',monospace;color:#d9dce6}
.g-link button{flex:none;border:0;border-radius:8px;padding:10px 14px;font:600 13px/1 'Sora',sans-serif;color:#120d16;background:#ff8fe6;cursor:pointer}
.g-link button:hover{background:#ffb3ef}
.g-link button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div id="root" tabindex="0" aria-label="Setap 3D — interaktiv kompyuter setapi" style="position: relative; width: 100%; height: 100vh; min-height: 560px; overflow: hidden; background: #120d16; font-family: 'Sora', sans-serif; color: #f1f2f6; outline: none">
  <video id="video" muted playsinline autoplay aria-hidden="true" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"></video>
  <canvas id="canvas" aria-label="Kompyuter setapining 3D sahnasi" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab"></canvas>

  <div id="fps" data-d="flex" class="glass" role="status" style="position: absolute; right: 16px; top: 16px; padding: 8px 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; pointer-events: none; font-family: 'JetBrains Mono', monospace">
    <div id="fpsDot" style="width: 8px; height: 8px; border-radius: 50%"></div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 15px; font-weight: 700; color: #fff; line-height: 1"><span id="fpsText">--</span> <span style="font-size: 11px; font-weight: 500; color: rgba(255,255,255,.7)">FPS</span></div>
      <div id="fpsInfo" style="font-size: 10.5px; color: rgba(255,255,255,.72); line-height: 1.2"></div>
    </div>
  </div>

  <div id="tip" class="glass" role="tooltip" style="position: absolute; left: 0; top: 0; padding: 7px 11px; border-radius: 9px; font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s"></div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; pointer-events: none">
    <button id="back" data-d="flex" type="button" class="act glass panel" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; pointer-events: auto">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      Orqaga
    </button>
  </div>

  <div id="spot" class="spot off" aria-hidden="true"></div>

  <div id="vrUi">
    <div style="position: absolute; left: 16px; top: 16px">
      <button id="vrExit" type="button" class="act glass panel" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3h-3l-2-3h-2l-2 3H6a3 3 0 0 1-3-3z"></path><path d="M4 4l16 16"></path></svg>
        VR dan chiqish
      </button>
    </div>
    <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none">
      <div id="vrMsg" class="glass panel" role="status" style="padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600"></div>
      <div id="vrLabel" class="glass" style="padding: 8px 14px; border-radius: 999px; font-size: 12px; color: rgba(255,255,255,.82)"></div>
    </div>
  </div>

  <div id="vrFade" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .55s ease; background: #000">
    <div id="vrLens" style="position: absolute; inset: -20%; transition: transform .6s ease; background: radial-gradient(circle at 34% 50%, rgba(140,60,255,.35) 0%, rgba(0,0,0,0) 22%), radial-gradient(circle at 66% 50%, rgba(255,60,200,.3) 0%, rgba(0,0,0,0) 22%)"></div>
  </div>

  <div id="curtain" data-d="flex" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #120d16; transition: opacity .6s ease">
    <div id="loading" data-d="flex" style="display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div class="ring" aria-hidden="true"></div>
      <div role="status" style="font-size: 13px; color: rgba(241,242,246,.7)">3D sahna tayyorlanmoqda…</div>
    </div>
    <div id="blocked" role="alert" style="max-width: 380px; text-align: center; display: none; flex-direction: column; gap: 14px; align-items: center; padding: 0 24px">
      <div style="font-size: 44px; line-height: 1" aria-hidden="true">💻</div>
      <div style="font-size: 20px; font-weight: 600; line-height: 1.35">Bu tajriba faqat Mac, iPhone va iPad uchun</div>
      <div style="font-size: 14px; line-height: 1.6; color: rgba(241,242,246,.72)">Saytni Apple qurilmangizda oching. Havolani nusxalab, Mac yoki iPhone'ingizga yuborishingiz mumkin.</div>
      <button id="copyLink" type="button" class="act" style="margin-top: 4px">Havolani nusxalash</button>
    </div>
    <div id="failed" data-d="flex" role="alert" style="max-width: 340px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 0 24px">
      <div style="font-size: 16px; font-weight: 600">3D sahnani ochib bo'lmadi</div>
      <div id="failMsg" style="font-size: 13px; line-height: 1.5; color: rgba(241,242,246,.7)"></div>
      <button id="retry" type="button" class="act">Qayta urinish</button>
    </div>
  </div>
</div>
<script>
  // Apple-only: macOS, iOS, iPadOS. Other systems get a short guide instead of the 3D scene (nothing heavy is downloaded).
  (function () {
    var V = '202610191614';
    var uad = navigator.userAgentData, ua = navigator.userAgent || '', pf = navigator.platform || '';
    var apple = uad && uad.platform ? /^(macOS|iOS)$/i.test(uad.platform) : (/iPhone|iPad|iPod|Macintosh|Mac OS X/i.test(ua) || /^(Mac|iPhone|iPad|iPod)/i.test(pf));
    if (apple) {
      ['js/config.js', 'js/setup3d.js', 'js/app.js', 'js/component.js'].forEach(function (f) { document.write('<script src="' + f + '?v=' + V + '"><\/script>'); });
      return;
    }
    var os = /Android/i.test(ua) ? 'Android' : /Windows/i.test(ua) ? 'Windows' : /CrOS/i.test(ua) ? 'ChromeOS' : /Linux/i.test(ua) ? 'Linux' : (uad && uad.platform) || 'bu qurilma';
    var url = String(location.href).split('#')[0];
    var root = document.getElementById('root');
    root.innerHTML =
      '<div class="guide">' +
        '<div class="g-badge">Faqat Apple qurilmalari uchun</div>' +
        '<h1>Iltimos, Apple qurilmasidan kiring</h1>' +
        '<p class="g-lead">Bu 3D tajriba Mac, iPhone va iPad uchun yaratilgan. Siz hozir <b>' + os + '</b> qurilmasidasiz, unda sayt ochilmaydi.</p>' +
        '<ol class="g-steps">' +
          '<li><span>1</span><div><b>Mac’da oching</b><small>Safari yoki Chrome brauzerida</small></div></li>' +
          '<li><span>2</span><div><b>yoki iPhone / iPad’da oching</b><small>Safari orqali</small></div></li>' +
          '<li><span>3</span><div><b>Havolani o‘zingizga yuboring</b><small>Nusxalab, masalan Telegram’dagi “Saqlangan xabarlar”ga tashlang</small></div></li>' +
        '</ol>' +
        '<div class="g-link"><code>' + url.replace(/</g, '&lt;') + '</code><button type="button" id="gCopy">Nusxalash</button></div>' +
      '</div>';
    var btn = document.getElementById('gCopy');
    btn.addEventListener('click', function () {
      var done = function () { btn.textContent = 'Nusxalandi ✓'; setTimeout(function () { btn.textContent = 'Nusxalash'; }, 2200); };
      var fallback = function () { var a = document.createElement('textarea'); a.value = url; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); done(); };
      try { navigator.clipboard.writeText(url).then(done, fallback); } catch (e) { fallback(); }
    });
  })();
</script>
</body>
</html>
